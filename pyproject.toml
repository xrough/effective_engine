[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvlab"
version = "0.1.0"
description = "Rough-volatility research toolkit and data-analysis recipe library for the Effective Engine notebooks"
readme = "notebooks/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab",
    "ipykernel",
    "jupyter-client>=8",
    "nbformat",
    "nbconvert",
    "seaborn",
    "pyarrow>=14",
    "optuna>=3",
    "tidyfinance>=0.3",
    "xgboost>=2",
    "lightgbm>=4",
]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
performance = ["polars>=0.20"]
dev = ["pytest>=7", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rvlab*"]

[tool.pytest.ini_options]
testpaths = ["src/rvlab/tests"]
filterwarnings = [
    # pandas 2.3 + numpy 2.5 emit this on every pd.Timedelta(...) construction.
    "ignore:.*generic.*unit for NumPy timedelta.*:DeprecationWarning",
    "ignore:.*utcfromtimestamp.*:DeprecationWarning",
]
